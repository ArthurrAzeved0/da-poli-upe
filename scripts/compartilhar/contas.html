<style>

  html,body { width:1200px; height:630px; overflow:hidden; }

  .carimbo div { padding:14px 22px; font:800 30px 'Barlow Condensed'; }

  .carimbo small { display:block; font:700 13px 'Barlow Condensed'; letter-spacing:.08em; text-transform:uppercase; color:#FADADD; }

</head>
