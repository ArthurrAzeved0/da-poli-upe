name: Deploy

# Every update of main publishes the site, the ETL and the database migrations.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://da-poli.pages.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Never publish something that fails the checks.
      - run: npm run cabecalho:check
      - run: npm run typecheck
      - run: npm test

      - name: Migrações do banco (D1)
        working-directory: apps/etl
        run: npx wrangler d1 migrations apply da-poli --remote

      - name: ETL (Worker agendado)
        working-directory: apps/etl
        run: npx wrangler deploy

      - name: Site (Cloudflare Pages)
        working-directory: apps/site
        run: |
          npx astro build
          npx wrangler pages deploy dist --project-name da-poli --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s)"
